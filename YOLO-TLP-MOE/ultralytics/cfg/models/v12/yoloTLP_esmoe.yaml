# YOLO-TLP + backbone-only ES-MoE
# Keep SPDConv + P2 head. Add ES_MOE only in backbone.

nc: 80
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]                    # 1-P2/4
  - [-1, 2, C2fCIB, [128, True, True]]

  - [-1, 1, SPDConv, [128]]                       # 3-P3/8
  - [-1, 4, C2fCIB, [256, True, True]]
  - [-1, 1, ES_MOE, [256, 4, 8, 2, True, 0.0]]   # c2, num_experts, reduction, top_k, sparse_inf, dyn_thresh

  - [-1, 1, SPDConv, [256]]                       # 6-P4/16
  - [-1, 4, C2fCIB, [512, True, True]]
  - [-1, 1, ES_MOE, [512, 4, 8, 2, True, 0.0]]

  - [-1, 1, Conv, [512, 3, 2]]                    # 9-P5/32
  - [-1, 2, C2fCIB, [512, True, True]]
  # no MoE here initially; add later only if ablation is positive

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 8], 1, Concat, [1]]
  - [-1, 2, C2fCIB, [256, False]]                 # 13 P4/16

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 5], 1, Concat, [1]]
  - [-1, 2, C2fCIB, [128, False]]                 # 16 P3/8

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 2], 1, Concat, [1]]
  - [-1, 4, C2fCIB, [128, False]]                 # 19 P2/4

  - [-1, 1, Conv, [128, 3, 2]]
  - [[-1, 16], 1, Concat, [1]]
  - [-1, 2, C2fCIB, [256, False]]                 # 22 P3/8

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]]
  - [-1, 2, C2fCIB, [512, False]]                 # 25 P4/16

  - [[19, 22, 25], 1, Detect, [nc]]               # Detect(P2, P3, P4)
