# Ultralytics YOLO-TLP + backbone ES_MOE + P5 detection
# Keep original YOLO-TLP design:
# - SPDConv
# - C3k2
# - PSA
# - SPPF
# - P2/P3/P4/P5 detection heads
# Add ES_MOE only in backbone P3 and P4 stages

nc: 1  # DeepLesion single class

scales:
  # [depth, width, max_channels]
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]                     # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]                    # 1-P2/4
  - [-1, 4, C2fCIB, [128, False, 0.25]]           # 2

  - [-1, 1, SPDConv, [128]]                       # 3-P3/8
  - [-1, 4, C2fCIB, [256, False, 0.25]]           # 4
  - [-1, 1, ES_MOE, [256, 4, 8, 2, True, 0.0]]   # 5  MoE after P3 stage

  - [-1, 1, SPDConv, [256]]                       # 6-P4/16
  - [-1, 4, C3k2, [512, True]]                    # 7
  - [-1, 1, ES_MOE, [512, 4, 8, 2, True, 0.0]]   # 8  MoE after P4 stage

  - [-1, 1, Conv, [1024, 3, 2]]                   # 9-P5/32
  - [-1, 3, C3k2, [1024, True]]                   # 10
  - [-1, 1, PSA, [1024, 0.5]]                     # 11
  - [-1, 1, SPPF, [1024, 5]]                      # 12

head:
  # P5/32 -> P4/16
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]    # 13
  - [[-1, 8], 1, Concat, [1]]                     # 14 cat with P4
  - [-1, 4, C3k2, [512, False]]                   # 15

  # P4/16 -> P3/8
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]    # 16
  - [[-1, 5], 1, Concat, [1]]                     # 17 cat with P3
  - [-1, 4, C2fCIB, [256, False]]                 # 18

  # P3/8 -> P2/4
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]    # 19
  - [[-1, 2], 1, Concat, [1]]                     # 20 cat with P2
  - [-1, 4, C2fCIB, [128, False]]                 # 21 P2 output

  # P2/4 -> P3/8 bottom-up
  - [-1, 1, Conv, [128, 3, 2]]                    # 22
  - [[-1, 18], 1, Concat, [1]]                    # 23 cat with P3
  - [-1, 4, C3k2, [256, False]]                   # 24 P3 output

  # P3/8 -> P4/16 bottom-up
  - [-1, 1, Conv, [256, 3, 2]]                    # 25
  - [[-1, 15], 1, Concat, [1]]                    # 26 cat with P4
  - [-1, 4, C3k2, [512, False]]                   # 27 P4 output

  # P4/16 -> P5/32 bottom-up
  - [-1, 1, Conv, [512, 3, 2]]                    # 28
  - [[-1, 12], 1, Concat, [1]]                    # 29 cat with P5 backbone
  - [-1, 4, C3k2, [1024, True]]                   # 30 P5 output

  # Detection heads at P2, P3, P4, P5
  - [[21, 24, 27, 30], 1, Detect, [nc]]           # 31 Detect(P2, P3, P4, P5)
